name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - name: Generate Keystore & Export APK
        run: |
          mkdir -p /root/.android build
          rm -f /root/.android/debug.keystore
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          godot --headless --verbose --export-debug "Android" build/RobRunnerMobile.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RobRunnerMobile-APK
          path: build/RobRunnerMobile.apk