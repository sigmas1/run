name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Import & Export APK
        run: |
          mkdir -p build
          godot --headless --import --quit
          godot --headless --verbose --export-debug "Android" build/RobRunnerMobile.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RobRunnerMobile-APK
          path: build/RobRunnerMobile.apk