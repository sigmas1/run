name: Build APK
on: [push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - name: Generate Keystore & Export APK
        run: |
          mkdir -p /root/.android build
          rm -f /root/.android/debug.keystore
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          godot --headless --export-debug "Android" build/RobRunnerMobile.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Rob Runner Mobile APK
          files: build/RobRunnerMobile.apk